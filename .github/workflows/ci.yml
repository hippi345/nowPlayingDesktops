name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            dbus-x11 xvfb feh gsettings-desktop-schemas dconf-cli

      - name: Ruff
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Build package
        run: pip install build && python -m build

      - name: Verify editable install (clean venv, outside repo)
        run: |
          python -m venv /tmp/npd-packaging-venv
          /tmp/npd-packaging-venv/bin/pip install -e .
          cd /tmp
          /tmp/npd-packaging-venv/bin/python -c "import now_playing_desktops"
          /tmp/npd-packaging-venv/bin/now-playing --help
          /tmp/npd-packaging-venv/bin/python -m now_playing_desktops --help

      - name: Tests
        run: pytest --cov=now_playing_desktops --cov-report=term-missing -q

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Tests
        run: pytest --cov=now_playing_desktops --cov-report=term-missing -q

      - name: Windows display enumeration smoke test
        run: pytest tests/test_platforms_windows_monitors.py::test_real_monitor_enumeration_and_compose -q
