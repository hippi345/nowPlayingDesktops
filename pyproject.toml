[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "now-playing-desktops"
version = "1.0.0"
description = "Set your desktop wallpaper to the album art of your currently playing Spotify track."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Joel Shearon" }]
keywords = ["spotify", "desktop", "wallpaper", "album-art"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pillow>=11.0.0,<12",
    "requests>=2.32.0,<3",
    "spotipy>=2.24.0,<3",
]

[project.optional-dependencies]
macos = ["appscript>=1.2.5,<2"]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-cov>=6.0.0,<7",
    "ruff>=0.9.0,<1",
]

[project.scripts]
now-playing = "now_playing_desktops.cli:main"
now-playing-macos = "now_playing_desktops.cli:main_macos"
now-playing-windows = "now_playing_desktops.cli:main_windows"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
only-packages = true

[tool.hatch.build.targets.editable]
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "integration: optional live desktop-tool tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["now_playing_desktops"]
branch = true
